<title>Sala de Marketing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de status; equipe + seu painel à esquerda; sala pixel art + abas à direita. No celular: uma seção por vez com navegação inferior. Tema noturno único, por escolha. */
:root{
  --bg:#0c101d; --panel:#141a2b; --panel2:#1a2236; --deep:#111727; --line:#27304a; --fg:#e7eaf3; --muted:#8d96b2;
  --accent:#8b7bff; --accent-ink:#0c101d; --gold:#f2c94c;
  --prod:#5ad18a; --ref:#3fc1c9; --meet:#6ea8ff; --com:#f2c94c; --dis:#ef5a6f; --idle:#a07cc5; --pause:#6b7390;
  --display:'Pixelify Sans',ui-monospace,monospace;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
input,select,textarea{background:var(--deep);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:7px 9px;font:inherit;min-width:0}
textarea{resize:vertical;min-height:64px;width:100%}
.gl{width:1em;height:1em;vertical-align:-.15em;margin-right:.25em;flex:none}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand canvas{width:34px;height:34px;image-rendering:pixelated}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:.02em;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;margin-left:auto}
.stat{padding:2px 14px;border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
.clock{display:flex;align-items:center;gap:8px}
.clock .mono{font-size:19px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 8px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.topact{display:flex;gap:8px;flex-wrap:wrap}
.cta{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:600}
.cta.end{background:#f4f6fa;color:#141a2b}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 12px;color:var(--fg)}
.ghost.sm,.cta.sm{padding:4px 9px;font-size:12px}
.danger{background:transparent;border:1px solid #6b2e3a;color:#ff9aa8;border-radius:6px;padding:7px 12px}

.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.app{grid-template-columns:minmax(0,1fr)}.team{order:2}.stats{margin-left:0}}

.team{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px}
.team h2,.panel h2{font-family:var(--display);font-weight:500;font-size:16px;margin:0;letter-spacing:.03em}
.teamlist{display:grid;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;vertical-align:middle;margin-right:4px;flex:none}
.member{border:1px solid transparent;border-radius:7px;padding:8px;display:block;width:100%;text-align:left;background:transparent}
.member:hover{background:var(--panel2)}
.member[aria-expanded="true"]{background:var(--panel2);border-color:var(--line)}
.member.ceo{border-color:#5a4b17;background:#191609}
.mrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center}
.av{width:36px;height:48px;image-rendering:pixelated;background:#222a40;border-radius:4px}
.mname{font-weight:600;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.role{font-size:10.5px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.role.pri{color:var(--fg);border-color:#4a4386;background:#211d45}
.role.crown{color:#141a2b;background:var(--gold);border-color:var(--gold);font-weight:600}
.you{font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 5px;font-weight:600}
.mstatus{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ia{display:inline-block;font-size:10px;font-weight:600;background:#203b3d;color:#7fe3e9;border-radius:3px;padding:0 4px;margin-left:4px}
.mus{display:inline-block;font-size:10px;font-weight:700;background:#3a3214;color:var(--gold);border-radius:3px;padding:0 4px;margin-left:4px}
.pct{text-align:right}
.pct b{font-family:var(--mono);font-size:17px;font-weight:500;display:block;line-height:1.1}
.pct span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:#232b42;margin-top:7px}
.bar i{display:block;height:100%}
.detail{margin-top:10px;display:grid;gap:10px;font-size:12.5px}
.tl{position:relative;height:16px;background:#232b42;border-radius:3px;overflow:hidden}
.tl i{position:absolute;top:0;bottom:0}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv div{background:var(--deep);border-radius:5px;padding:5px 6px}
.kv b{display:block;font-family:var(--mono);font-weight:500;font-size:13px}
.kv span{font-size:10px;color:var(--muted)}
.applist{display:grid;gap:4px}
.applist div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.applist em{font-style:normal;font-family:var(--mono);color:var(--muted)}
.sub{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.done{margin:0;padding-left:16px}

.usercard{border:1px solid #3b3570;background:#151832;border-radius:8px;padding:10px;display:grid;gap:10px;font-size:12.5px}
.usercard.ceo{border-color:#5a4b17;background:#191609}
.usercard select{width:100%}
.uhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.uhead b{font-family:var(--display);font-weight:500;font-size:15px}
.privacy{font-size:11.5px;color:var(--muted)}
.privacy b{color:var(--fg);font-weight:500}
.stepper{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.stepper button{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--deep);padding:0}
.stepper output{font-family:var(--mono);min-width:16px;text-align:center}
.mult{font-family:var(--mono);font-size:12px;color:#7fe3e9}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.toggle{display:flex;gap:8px;align-items:center}
.budget{display:grid;gap:4px}
.budget .prog{margin-top:0}
.pend{display:grid;gap:6px}
.pend button{text-align:left;background:var(--deep);border:1px solid var(--line);border-left:3px solid var(--com);border-radius:6px;padding:6px 8px;font-size:12px}
.pend button.call{border-left-color:var(--dis)}
.pend button.msg{border-left-color:var(--meet)}

.roomwrap{position:relative;border-radius:8px;overflow:hidden;border:3px solid #232a42;background:#000;container-type:inline-size}
#room{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;cursor:pointer}
#overlay{position:absolute;inset:0;pointer-events:none;font-size:clamp(7px,1.08cqi,12px)}
.tag,.bub,.free,.wl,.sign,.igc{position:absolute;white-space:nowrap}
.tag{transform:translate(-50%,0);background:#141a2bdd;border:1px solid #3a4466;color:var(--fg);border-radius:4px;padding:0 .5em;font-weight:600;font-size:1em;line-height:1.6;pointer-events:auto}
.tag.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.ceo{background:var(--gold);color:#141a2b;border-color:var(--gold)}
.tag.guest{border-style:dashed;color:#cfd5e6;font-weight:500}
.tag small{font-weight:500;color:var(--muted);margin-left:.3em}
.tag .tsub{display:block;font-size:.72em;font-weight:600;color:var(--gold);line-height:1.15;margin-bottom:.2em;text-align:center}
.tag.sel .tsub{color:#4a3608}
.tag.sel small,.tag.ceo small{color:#141a2b}
.sign{transform:translate(-50%,0);background:#141a2b99;color:var(--muted);border-radius:4px;padding:0 .5em;line-height:1.6;font-size:.95em;pointer-events:auto;border:1px dashed #3a4466}
.sign.ceo{border-color:#8a7426;color:var(--gold)}
.bub{transform:translate(-50%,-100%);background:#f4f6fa;color:#1a1f2e;border-radius:4px;padding:0 .5em;line-height:1.6;font-size:.95em;box-shadow:0 1px 0 #0005;display:flex;align-items:center}
.bub i{display:inline-block;width:.6em;height:.6em;border-radius:2px;margin-right:.35em}
.bub .ia,.bub .mus{font-size:.85em}
.bub .mus{background:#1a1f2e;color:var(--gold)}
.bub .tm{font-family:var(--mono);margin-left:.4em;font-weight:500}
.bub .tm.over{color:#c62f45}
.bub:after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:#f4f6fa}
.free{transform:translate(-50%,-100%);background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:.15em .6em;font-weight:600;font-size:1em;pointer-events:auto}
.wl{transform:translate(-50%,0);font-size:.85em;color:#dfe4f2;background:#141a2bcc;border:0;border-radius:3px;padding:0 .45em;pointer-events:auto;line-height:1.5}
.wl.sab{background:#ef5a6f;color:#fff;font-weight:700;font-family:var(--display);letter-spacing:.06em}
.igc{transform:translate(-50%,0);color:#fff;font-family:var(--mono);font-weight:500;font-size:.9em;line-height:1.2;pointer-events:auto;background:transparent;border:0;padding:0;text-shadow:0 1px 0 #0006}
.banner{position:absolute;left:50%;top:22%;transform:translate(-50%,0);background:#f4f6fa;color:#141a2b;font-family:var(--display);font-weight:700;font-size:clamp(14px,2.4cqi,26px);padding:.2em .8em;border-radius:6px;border:3px solid #e1306c;box-shadow:0 4px 0 #0006;pointer-events:none;white-space:nowrap}
@container (max-width:560px){.bub,.wl:not(.sab),.igc{display:none}.tag small{display:none}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-top:14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:6px 8px 0;overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);font-family:var(--display);font-size:14px;letter-spacing:.03em;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.cnt{font-family:var(--body);font-size:10px;background:var(--com);color:#141a2b;border-radius:8px;padding:0 5px;margin-left:4px;font-weight:600}
.pbody{padding:12px 14px;min-height:240px}
.log{display:grid;max-height:280px;overflow-y:auto}
.lrow{display:grid;grid-template-columns:50px 96px minmax(0,1fr);gap:10px;padding:5px 0;border-bottom:1px solid #1e2640;font-size:13px;align-items:center}
.lrow .t{font-family:var(--mono);color:var(--muted);font-size:12px}
@media (max-width:560px){.lrow{grid-template-columns:44px minmax(0,1fr)}.lrow .n{display:none}}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kanban{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--deep);border-radius:7px;padding:8px;display:grid;gap:6px;align-content:start}
.col h3{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.card{background:var(--panel2);border-radius:5px;padding:8px;border:0;border-left:4px solid;display:grid;gap:5px;font-size:13px;text-align:left;width:100%}
.card:hover{background:#212a42}
.card{cursor:grab;gap:7px}
.card{touch-action:pan-y;user-select:none}
.card.drag{opacity:.25;outline:2px dashed #3a4466;outline-offset:-2px}
.dghost{position:fixed;z-index:200;pointer-events:none;margin:0;cursor:grabbing;box-shadow:0 18px 40px #000a,0 0 0 1px #4a4386;transition:transform .12s ease-out;will-change:left,top,transform}
.dghost.fly{transition:left .22s ease,top .22s ease,transform .22s ease,opacity .22s ease}
.card.land{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(1.04);box-shadow:0 0 0 2px var(--accent)}100%{transform:none}}
body.grabbing,body.grabbing *{cursor:grabbing!important}
.col.over{outline:2px dashed var(--accent);outline-offset:2px}
.ctop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bdg.me{background:#211d45;color:#c9c1ff;flex:none}
.cchips{display:flex;flex-wrap:wrap;gap:4px}
.chip2{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:#c8cee0}
.chip2.line{background:#2a2558;border-color:#4a4386;color:#e3defd;font-weight:600}
.cfacts{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;background:var(--deep);border-radius:6px;padding:6px 8px}
.cfacts div:first-child{grid-column:1/-1}
.cfacts div:first-child b{font-family:var(--body);font-weight:600}
.cfacts span,.facts span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cfacts b{font-size:12px;font-weight:500;font-family:var(--mono)}
.late{color:var(--dis)!important}
.cfoot{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.cfoot b{color:var(--fg);font-weight:500}
.phase{display:flex;align-items:center;gap:3px}
.phase i{width:18px;height:5px;border-radius:3px;background:#2a3350}
.phase i.ok{background:var(--prod)}.phase i.cur{background:var(--com)}
.phase em{font-style:normal;font-size:11px;color:var(--muted);margin-left:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.facts div{background:var(--deep);border-radius:6px;padding:7px 9px}
.facts b{font-size:13px;font-weight:500}
.pickbtn{display:flex;gap:8px;align-items:center;width:100%;background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 10px;text-align:left}
.pickbtn svg{width:16px;height:16px;flex:none;color:var(--muted)}
.cal{margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.calh{display:flex;justify-content:space-between;align-items:center}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calg .wd{font-size:11px;color:var(--muted);text-align:center}
.day,.slot{background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:6px 0;font-family:var(--mono);font-size:13px;color:var(--fg)}
.day:hover:not(:disabled),.slot:hover{border-color:var(--accent)}
.day.sel,.slot.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.today{box-shadow:inset 0 0 0 1px var(--gold)}
.day:disabled{opacity:.28;cursor:not-allowed}
.day.full:disabled{opacity:.75;color:#ff9aa8;text-decoration:line-through;border-color:#6b2e3a}
.timeg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;max-height:190px;overflow-y:auto}
.timeg .slot:first-child{grid-column:1/-1;font-family:var(--body)}
.namechip{display:inline-block;border-radius:5px;padding:1px 8px;font-weight:600;white-space:nowrap}
.ttl{display:inline-block;font-size:10px;font-weight:600;color:var(--gold);border:1px solid #6b5a1f;border-radius:4px;padding:0 5px}
.tvc,.tvw{position:absolute;transform:translate(-50%,0);font-size:.55em;font-weight:700;line-height:1.1;pointer-events:none;white-space:nowrap}
.tvc{color:#f2c94c;text-transform:uppercase;letter-spacing:.05em}
.tvw{color:#1c1408;font-size:.9em;font-weight:700;font-family:var(--body);text-transform:uppercase;letter-spacing:0;line-height:1;text-align:center;transform:translate(-50%,-50%)!important}
@container (max-width:560px){.tvc,.tvw{display:none}}
.tvn{position:absolute;transform:translate(-50%,-100%) rotate(180deg);writing-mode:vertical-rl;font-size:.6em;font-weight:700;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;pointer-events:none;line-height:1;white-space:nowrap}
.sabn{position:absolute;display:grid;grid-template-columns:1fr 1fr;gap:0 .35em;font-size:.5em;line-height:1.3;font-weight:700;pointer-events:none;overflow:hidden}
.sabn span{color:#7d8594;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sabn .y{color:#1f8a4c}.sabn .n{color:#c62f45;text-decoration:line-through}
.ghead h3{margin:0;font-family:var(--display);font-size:18px}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.gcard{background:var(--deep);border:1px solid #3a3214;border-radius:8px;padding:10px;display:grid;gap:8px}
.gh{display:flex;gap:10px;align-items:center}
.gh canvas{width:36px;height:78px;image-rendering:pixelated;background:repeating-conic-gradient(#1a2238 0 25%,#151c30 0 50%) 0 0/12px 12px;border-radius:6px;flex:none}
.gh b{font-size:15px;color:var(--gold)}
.grank{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:12.5px}
.grank li{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.grank li.first{color:var(--fg);font-weight:600}
.grank li.win span:after{content:" ★";color:var(--gold)}
.grank em{font-style:normal;font-family:var(--mono)}
.gpeople{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.gperson{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;background:var(--deep);border-radius:8px;padding:8px}
.gperson canvas{width:36px;height:48px;image-rendering:pixelated;background:#222a40;border-radius:4px}
.gmain{color:var(--gold);font-weight:600;font-size:13px}
.gsec{color:var(--fg);font-size:12.5px}
.gsub{color:var(--muted);font-size:11px}
@container (max-width:560px){.tvn,.sabn{display:none}}
.card .t{font-weight:700;font-size:20px;line-height:1.25}
.card.vinc{box-shadow:0 0 0 2px #b9a8ff,0 0 14px 2px #8b7bffaa;animation:vglow 1.8s ease-in-out infinite}
@keyframes vglow{0%,100%{box-shadow:0 0 0 2px #b9a8ff,0 0 10px 1px #8b7bff88}50%{box-shadow:0 0 0 2px #e4dcff,0 0 22px 5px #8b7bffcc}}
@media (prefers-reduced-motion:reduce){.card.vinc{animation:none}}
.dghost.vinc{animation:none}
.card .meta{font-size:11px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.bdg{font-size:10.5px;border-radius:3px;padding:0 5px;background:#262f48;color:#c8cee0}
.bdg.vote{background:#3a3214;color:#f2c94c}.bdg.tr{background:#16314a;color:#8fc4ff}.bdg.help{background:#163a2c;color:#7fe0a8}.bdg.obs{background:#3a1d24;color:#ff9aa8}
.newtask{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:8px;margin-bottom:12px;align-items:start}
@media (max-width:760px){.newtask{grid-template-columns:minmax(0,1fr)}}
.newtask textarea{min-height:38px;height:38px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}

    ${helped.length?`<div><h4>Ajudou em</h4><ul>${helped.map(t=>`<li>${esc(t.title)} (de ${esc(nameOf(t.owner))})</li>`).join('')}</ul></div>`:''}

    ${fr.length?'':'<div class="err">Todas as mesas estão ocupadas. Fale com o administrador para liberar uma.</div>'}`+navBar('Continuar',draft.desk==null)}
  else{h+=`<h2 id="onbTitle">O que o agente registra</h2><p>O agente roda no Windows ou macOS e envia, a cada minuto, só o necessário para classificar seu tempo.</p>
    <div class="cols2"><div class="note" style="max-width:none"><b style="color:var(--prod)">Registramos</b><ul><li>Nome do app em foco (ex.: Figma)</li><li>Nos navegadores, só "navegando na internet" e a categoria da página, calculada no seu computador</li><li>Se há música ou vídeo tocando, para colocar o fone no personagem</li><li>5 min sem teclado ou mouse como ociosidade</li><li>Quantos agentes do ChatGPT e do Claude estão rodando</li><li>Mensagens do chat interno passam por um filtro de palavras que sinaliza assunto fora da demanda</li></ul></div>
    <div class="note" style="max-width:none"><b style="color:var(--dis)">Nunca registramos</b><ul><li>Qual navegador nem endereços de sites</li><li>Capturas de tela</li><li>Teclas digitadas</li><li>Títulos de janelas</li><li>O que você está ouvindo</li><li>Conteúdo de arquivos</li></ul></div></div>
    <label class="check"><input type="checkbox" id="ok" ${draft.ok?'checked':''}> Li e concordo. Sei que posso ver todos os meus dados e que pausas são marcadas pela copa.</label>`+navBar('Entrar no escritório',!draft.ok)}
  om.innerHTML=h;drawPreview();bindOnb()}
function bindOnb(){
  const q=s=>om.querySelector(s),qa=s=>om.querySelectorAll(s);
  q('#back').onclick=()=>{stepN--;renderOnb()};
  q('#next').onclick=()=>{if(q('#next').disabled)return;if(stepN===1&&isCeoName(draft.name)){joinCEO();return}if(stepN===NSTEP-1){join();return}stepN++;renderOnb()};
  if(stepN===0){q('#lg').onclick=()=>{draft.auth='conta Google';renderOnb()};q('#le').onclick=()=>{draft.auth='link por e-mail confirmado';renderOnb()};
    q('#quick').onclick=()=>{Object.assign(draft,{desk:freeDesks()[0],name:'Paula',sex:'f',skin:'#e0ac85',hair:'#2a1a12',hs:'longo',acc:'nenhum',out:'blazer',oc:'#8b7bff',main:'Designer',adj:['Social Media'],ok:true});join()}}
  qa('[data-desk]').forEach(b=>b.onclick=()=>{draft.desk=+b.dataset.desk;renderOnb()});
  qa('[data-skin]').forEach(b=>b.onclick=()=>{draft.skin=b.dataset.skin;renderOnb()});
  qa('[data-hair]').forEach(b=>b.onclick=()=>{draft.hair=b.dataset.hair;renderOnb()});
  qa('[data-hs]').forEach(b=>b.onclick=()=>{draft.hs=b.dataset.hs;renderOnb()});
  qa('[data-sex]').forEach(b=>b.onclick=()=>{draft.sex=b.dataset.sex;renderOnb()});
  qa('[data-beard]').forEach(b=>b.onclick=()=>{draft.beard=b.dataset.beard;renderOnb()});
  qa('canvas[data-mb]').forEach(c=>{const x=c.getContext('2d');x.clearRect(0,0,12,12);drawPerson(x,0,0,{...draft,beard:c.dataset.mb})});
  qa('[data-acc]').forEach(b=>b.onclick=()=>{draft.acc=b.dataset.acc;renderOnb()});
  qa('[data-out]').forEach(b=>b.onclick=()=>{draft.out=b.dataset.out;renderOnb()});
  qa('[data-oc]').forEach(b=>b.onclick=()=>{draft.oc=b.dataset.oc;renderOnb()});
  qa('[data-main]').forEach(b=>b.onclick=()=>{draft.main=b.dataset.main;draft.adj=draft.adj.filter(r=>r!==draft.main);renderOnb()});
  qa('[data-adj]').forEach(b=>b.onclick=()=>{const r=b.dataset.adj;draft.adj=draft.adj.includes(r)?draft.adj.filter(x=>x!==r):draft.adj.length<2?[...draft.adj,r]:draft.adj;renderOnb()});
  qa('canvas[data-mh]').forEach(c=>{const x=c.getContext('2d');x.clearRect(0,0,12,12);drawPerson(x,0,0,{...draft,hs:c.dataset.mh})});
  qa('canvas[data-mo]').forEach(c=>{const x=c.getContext('2d');x.clearRect(0,0,12,12);drawPerson(x,0,-10,{...draft,out:c.dataset.mo})});
  const nm=q('#nm');if(nm)nm.oninput=e=>{draft.name=e.target.value;q('#next').disabled=!draft.name.trim();const c=isCeoName(draft.name);q('#ceonote').hidden=!c;q('#next').textContent=c?'Entrar como CEO':'Continuar';drawPreview()};
  for(let i=0;i<4;i++){const t=q('#tm'+i);if(t)t.oninput=e=>{draft.t[i]=e.target.value;const ok=timesOk();q('#next').disabled=!ok;q('#terr').textContent=ok?'':TERR}}
  const fd=q('#fd');if(fd){fd.oninput=e=>draft.folder=e.target.value;q('#fdb').onclick=()=>{q('#fdn').textContent='No app instalado, este botão abre o seletor de pastas do Windows ou do macOS.'}}
  const ok=q('#ok');if(ok)ok.onchange=e=>{draft.ok=e.target.checked;q('#next').disabled=!draft.ok};
  const ph=q('#ph');if(ph)ph.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=sampleFace(img);draft.skin=s.skin;draft.hair=s.hair;draft.photo=r.result;renderOnb()};img.src=r.result};r.readAsDataURL(f)};
}
function afterJoin(){onb.hidden=true;refreshAll(true)}
function joinCEO(){ceo.isUser=true;ceo.state='desk';sel='ceo';log(ceo,'Entrou no sistema · coroa na cabeça','com');
  scheduled.push({at:simMin+2,fn:()=>sendMsg('p5','ceo',tasks.find(t=>t.title==='Planejamento Q1 2027').id,'Maurivon, o rascunho do Q1 sai hoje às 17h. Quer revisar antes de eu enviar para a equipe?')});
  afterJoin();toast('Bem-vindo, Maurivon. Perfil de CEO: coroa na cabeça e acompanhamento completo.')}
function join(){
  const u=mk({name:draft.name.trim()||'Você',sex:draft.sex,beard:draft.sex==='m'?draft.beard:'nenhuma',roles:[draft.main,...draft.adj],skin:draft.skin,hair:draft.hair,hs:draft.hs,acc:draft.acc,out:draft.out,oc:draft.oc,focus:1,sched:S(...draft.t)},6);
  Object.assign(u,{id:'me',desk:freeDesks().includes(draft.desk)?draft.desk:freeDesks()[0],isUser:true,state:'work',act:{app:DESK_APPS[draft.main][0]},folder:draft.folder,firstAt:simMin});
  people.splice(people.indexOf(ceo),0,u);sel='me';log(u,'Entrou no escritório','prod');log(u,'Em foco: '+u.act.app,'prod');
  scheduled.push({at:simMin+2,fn:()=>{const t=tasks.find(x=>x.title.startsWith('Status semanal'));if(!t)return;t.reserved=false;if(t.col==='afazer'&&!blocked(t))startT(t,'p5');if(t.owner==='p5'&&t.col==='fazendo'&&!t.transfer)transferT(t,'p5','me')}});
  scheduled.push({at:simMin+3,fn:()=>{const t=tasks.find(x=>x.title==='Key visual Black Friday');if(t)sendMsg('p4','me',t.id,'Quando o KV estiver pronto me avisa? Preciso dele para fechar a landing page.')}});
  scheduled.push({at:simMin+4,fn:()=>{const t=tasks.find(x=>x.title==='Key visual Black Friday');if(t&&t.col==='fazendo'&&t.owner==='p1')helpT(t,'p1',['me'],'Preciso de uma segunda opinião na versão 1080×1920 e de ajuda para exportar os formatos de stories.')}});
  scheduled.push({at:simMin+5,fn:()=>{const t=tasks.find(x=>x.title.startsWith('Captação'));if(t)sendMsg('p3','me',t.id,'Alguém vai no churrasco de sábado depois do expediente?')}});
  afterJoin();toast('Bem-vindo! Clique na copa para pausar e em qualquer pessoa para conversar ou chamar a atenção.');
}

applyMode();refreshAll(true);render();
</script>
