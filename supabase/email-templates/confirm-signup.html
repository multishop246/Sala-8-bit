<!doctype html>
<html lang="pt-BR"><body style="font-family:Arial,sans-serif;color:#172033;line-height:1.5">
<h2>Confirme seu acesso ao Sala 8-bit</h2>
<p>Para confirmar seu e-mail e entrar, digite este código na tela de entrada:</p>
<p style="font-size:30px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
<p>Se preferir, <a href="{{ .ConfirmationURL }}">confirme e entre por este link</a>.</p>
<p>O código e o link são de uso único. Não compartilhe este e-mail.</p>
<p>Se você não pediu este acesso, ignore a mensagem.</p>
</body></html>
