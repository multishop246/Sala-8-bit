# Gera os instaladores do app de computador (Windows .exe e macOS .dmg) e publica num Release do GitHub.
# Para gerar: Actions → "App de computador" → Run workflow (ou crie uma tag app-v0.5.0).
name: App de computador

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:db
      - run: npm run test:room
      - run: node scripts/test-workflow.mjs
      - run: node scripts/test-upgrade-060.mjs
      - run: npm run build
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }
      - name: Testes da classificação
        working-directory: desktop/src-tauri
        run: cargo test --lib
      - name: Dependências
        working-directory: desktop
        run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: app-v__VERSION__
          releaseName: 'Sala 8-bit para computador v__VERSION__'
          releaseBody: |
            Windows: baixe o arquivo terminado em -setup.exe. Ele inclui os componentes de IA e a tela Conexões de IA, sem downloads separados nem Python.
            Versão 0.7: escritório 3D, deslocamento do personagem por clique, retorno à mesa após 15 segundos sem interação e lounge após 5 minutos de inatividade. A etapa de captação e as execuções de IA não ativam essa ausência automática.
            Chrome, Edge e Opera GX exigem uma ativação da extensão por perfil; os arquivos já acompanham o EXE. O Codex exige a revisão de confiança dos conectores. Essas confirmações não são substituídas pelo instalador.
            Inclui correção de IA/ociosidade, aplicativos produtivos, etapas no relatório, função Video Maker e lembrete após uma hora de almoço.
            O conector Codex verifica o processo de execução pelo acesso limitado do Windows; a tela Conexões de IA mostra a chegada e a validação do último sinal do Codex.
            Veja as instruções e limites em docs/VERSAO-0.6.0.md. macOS: use o .dmg (Intel e Apple Silicon); a instalação integrada de conectores é específica do Windows.
            Os instaladores não são assinados: veja docs/APP-COMPUTADOR.md.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
