[package]
name = "sala-8-bit"
version = "0.6.1"
description = "Sala 8-bit · app de computador (escritório + medição do tempo)"
edition = "2021"
license = "MIT"

[lib]
name = "sala8bit"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
active-win-pos-rs = "0.9"
user-idle = "0.6"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
ureq = { version = "2", features = ["json"] }
gethostname = "0.5"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Win32_System_WinRT", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
